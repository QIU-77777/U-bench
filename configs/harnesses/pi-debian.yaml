id: pi-debian
name: Pi
protocol: openai
import_path: harbor_test_agents:MountedPi
manifest: harness/pi-debian/manifest.yaml
# The image mounts at /opt/pi-debian (see manifest), so the agent PATH must
# include its bin directory. This env reaches the agent phases only (Harbor
# scopes agent env off verifier commands), leaving the task image's own
# /usr/local intact for in-container verifiers.
env:
  PATH: /opt/pi-debian/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
kwargs:
  model_api: openai-completions
  thinking: medium
