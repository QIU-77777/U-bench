# Single source of truth for the pi-debian harness image.
# Same contract as harness/pi: the image root is exactly the contents of
# /usr/local, mounted read-only into every trial container.
#
# pi-debian is the glibc build of the pi CLI. The default harness/pi image
# is built FROM node:22-alpine (musl); its node binary cannot execute inside
# Debian-based task images (e.g. the wb-office python:3.12-slim tasks), which
# fails with "/usr/bin/env: 'node': No such file or directory". This variant
# is built FROM node:22-slim (glibc) for those tasks. Alpine-based task
# images must keep using harness/pi.
name: pi-debian
version: "1.2.0"
# Same CLI version as harness/pi; only the libc base and mount path differ.
npm_package: "@earendil-works/pi-coding-agent"
image_repository: harbor-test/harness/pi-debian
# Not /usr/local: an image mount there shadows the task image's own
# /usr/local (python, pip packages), which breaks in-container verifiers on
# Debian-based task images. The agent PATH is set via configs/harnesses/
# pi-debian.yaml env.
mount_path: /opt/pi-debian
